name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run lint
        id: lint
        run: npm run lint -- --format json > lint-report.json
      - name: Upload lint report
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          retention-days: 1
      - run: npm run typecheck
      - name: Run tests
        id: tests
        run: npm test > test-report.txt 2>&1
      - name: Upload test report
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt
          retention-days: 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image without platform variables
        id: docker-build
        run: |
          set -o pipefail
          docker build -t moatazai26-ci . 2>&1 | tee docker-build.log
      - name: Upload Docker build diagnostics
        if: failure() && steps.docker-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: docker-build.log
          retention-days: 1
      - name: Start image and verify health endpoint
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 3000:3000 moatazai26-ci)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy in time." >&2
          exit 1
