name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run lint
        id: lint
        run: npm run lint -- --format json > lint-report.json
      - name: Upload lint report
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          retention-days: 1
      - run: npm run typecheck
      - name: Run tests
        id: tests
        run: npm test > test-report.txt 2>&1
      - name: Upload test report
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt
          retention-days: 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=https://moatazalalqami.online \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder_1234567890 \
            --build-arg NEXT_PUBLIC_PASSWORD_AUTH_ENABLED=false \
            -t moatazai26-ci .
